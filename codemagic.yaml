workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    scripts:
      - name: Build Debug APK
        script: |
          cd DyslexiaBuddy
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - DyslexiaBuddy/app/build/outputs/apk/debug/*.apk
      
