workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    environment:
      android_signing:
        - release_keystore
      vars:
        PACKAGE_NAME: "com.dyslexiabuddy"
    scripts:
      - name: Build APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk

workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    scripts:
      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
