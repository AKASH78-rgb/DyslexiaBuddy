workflows:
  dyslexia-buddy-workflow:
    name: Dyslexia Buddy Android Workflow
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
          
      - name: Ensure Android Gradle Wrapper exists
        script: |
          cd android
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          cd ..
          
      - name: Build Flutter APK
        script: |
          flutter build apk --release
          
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - bakash0781@gmail.com
        notify:
          success: true
          failure: true
